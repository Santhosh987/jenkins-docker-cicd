apiVersion: apps/v1
kind: Deployment
metadata: 
  name: jenkins-cicd-app

spec:
  replicas: 2

  selector:
    matchLabels: 
      app: jenkins-cicd-app

  template:
    metadata:
      labels:
        app: jenkins-cicd-app

    spec:
      containers:
        - name: jenkins-cicd-app
          image: 937792903959.dkr.ecr.ap-south-1.amazonaws.com/jenkins-docker-cicd:${IMAGE_TAG}

          ports:
          - containerPort: 3000